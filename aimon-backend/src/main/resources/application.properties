# ========================================
# aimon-backend v0.2 Configuration
# Simplified from backyard - push-to-talk WebSocket v4
# ========================================

# --- HTTP Server ---
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# --- WebSocket ---
quarkus.websockets-next.server.max-message-size=65536

# --- Database Configuration ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aimon}
quarkus.datasource.username=${DB_USER:aimon}
quarkus.datasource.password=${DB_PASSWORD:aimon}
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.database.default-schema=aimon
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.schemas=aimon

# --- LiteLLM AI Service ---
ai.litellm.base-url=${AI_LITELLM_BASE_URL:http://localhost:4000}
ai.litellm.default-model=${AI_LITELLM_DEFAULT_MODEL:gemini-2.5-flash}
ai.litellm.api-key=${AI_LITELLM_API_KEY:sk-1234}
ai.litellm.max-output-tokens=2048
ai.litellm.temperature=0.7

# REST client configuration for LiteLLM
quarkus.rest-client.litellm-api.url=${ai.litellm.base-url}
quarkus.rest-client.litellm-api.connect-timeout=30000
quarkus.rest-client.litellm-api.read-timeout=120000

# --- Google Cloud STT (Speech-to-Text) ---
ai.google-stt.enabled=true
ai.google-stt.credentials-file=${GOOGLE_CREDENTIALS_FILE:/app/google-credentials.json}
ai.google-stt.language-code=vi-VN
ai.google-stt.model=latest_short
ai.google-stt.sample-rate=16000

# --- VieNeu-TTS (Primary TTS Provider) ---
ai.vieneu-tts.base-url=${AI_VIENEU_TTS_BASE_URL:http://localhost:5001}
ai.vieneu-tts.enabled=${AI_VIENEU_TTS_ENABLED:true}
ai.vieneu-tts.model=pnnbao-ump/VieNeu-TTS-0.3B
ai.vieneu-tts.voice-id=Ly
ai.vieneu-tts.response-format=pcm
ai.vieneu-tts.sample-rate=24000
ai.vieneu-tts.streaming=true
ai.vieneu-tts.silence-p=0.2
ai.vieneu-tts.pitch-shift=7.0

# REST client configuration for VieNeu-TTS
quarkus.rest-client.vieneu-tts-api.url=${ai.vieneu-tts.base-url}
quarkus.rest-client.vieneu-tts-api.connect-timeout=10000
quarkus.rest-client.vieneu-tts-api.read-timeout=60000

# --- Google Cloud TTS (Fallback TTS Provider) ---
ai.google-tts.enabled=true
ai.google-tts.credentials-file=${GOOGLE_CREDENTIALS_FILE:/app/google-credentials.json}
ai.google-tts.language-code=vi-VN
ai.google-tts.voice-name=vi-VN-Neural2-A
ai.google-tts.sample-rate=24000
ai.google-tts.speaking-rate=1.0
ai.google-tts.pitch=0.0

# --- TTS Orchestration (Circuit Breaker) ---
ai.tts.primary-provider=vieneu
ai.tts.fallback-provider=google
ai.tts.circuit-breaker.failure-threshold=3
ai.tts.circuit-breaker.reset-timeout=30000

# --- PowerMem Memory Service ---
memory.mcp.enabled=true
memory.mcp.api-key=${POWERMEM_API_KEY:dev-powermem-api-key}
memory.mcp.user-id=default

# REST client configuration for PowerMem
quarkus.rest-client.powermem-api.url=${POWERMEM_BASE_URL:http://localhost:8003}
quarkus.rest-client.powermem-api.connect-timeout=5000
quarkus.rest-client.powermem-api.read-timeout=10000

# PowerMem batch buffer settings
memory.mcp.batch-threshold=50

# PowerMem fault tolerance
mp.fault.tolerance.circuitbreaker.successThreshold=2
mp.fault.tolerance.circuitbreaker.failureRatio=0.5
mp.fault.tolerance.circuitbreaker.delay=5000
mp.fault.tolerance.circuitbreaker.requestVolumeThreshold=4

# --- PowerMem Context Retrieval ---
memory.context.max-tokens=150
memory.context.search-limit=10
memory.context.timeline-depth-before=5
memory.context.timeline-depth-after=3
memory.context.importance-threshold=0.5

# Search result caching (Caffeine)
memory.cache.ttl-minutes=5
memory.cache.max-size=100

# Interrupt pattern analysis
memory.interrupt.high-threshold=5.0
memory.interrupt.moderate-threshold=2.0
memory.interrupt.window-minutes=10

# --- Conversation Session Configuration ---
conversation.session.max-history=10
conversation.session.idle-timeout-minutes=30

# In-memory conversation history
conversation.history.max-turns=10
conversation.history.upload-on-close=true
conversation.history.upload-retry-count=3
conversation.history.upload-retry-delay-ms=1000

# --- Quest Import ---
quest.import.api-key=aimon-dev-import-key

# --- World Lore System ---
world.lore.max-inject=3

# --- Logging ---
quarkus.log.level=INFO
quarkus.log.category."dev.aimon".level=INFO
